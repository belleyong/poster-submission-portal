<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organiser sign-in · {{ config.event_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin">
  <header class="masthead"><div class="inner"><h1>Organiser dashboard</h1></div></header>
  <main style="max-width:420px">
    <form class="card" method="post">
      <div class="field">
        <label for="token">Access code</label>
        <input type="password" id="token" name="token" autofocus required>
      </div>
      <button type="submit">Sign in</button>
      {% if error %}<div class="notice bad">{{ error }}</div>{% endif %}
    </form>
  </main>
</body>
</html>
